<header [ngClass]="isHomePage() ? 'md:h-[250px]' : 'md:h-[160px]'"
        class="relative bg-primaryBlack h-[100px] w-full px-4 lg:px-8 flex flex-col lg:flex-row items-center justify-center">

  <section class="flex items-center gap-4 w-full md:w-auto md:absolute md:top-8 md:left-10 justify-start">
    <a href="/" aria-label="Go back home page">
      <img src="assets/img/logo-speaker-space.svg"
           class="h-15 brightness-0 invert"
           alt="Logo Speaker Space">
    </a>
    @if(isLogin()){
      <a href="/" class="text-white text-base md:text-2xl hidden md:block">Speaker Space</a>
    } @else {
      <p class="text-white text-base md:text-2xl">Speaker Space</p>
    }
  </section>

  @if(isLogin()){
    <nav class="flex items-center gap-4 absolute top-4 right-5 md:top-8 md:right-8 justify-end"
         aria-label="User navigation">
      <a class="flex items-center gap-2 mr-2 rounded-md text-md font-medium focus-visible:outline focus-visible:outline-2 text-gray-300 hover:bg-gray-900 hover:text-white focus-visible:outline-white cursor-pointer"
         href="/profile">
        My profile
      </a>
      <button type="button"
              class="relative"
              (click)="openSidebar()"
              aria-label="Open user menu"
              aria-haspopup="true">
        <img [src]="userPhotoURL() || 'assets/img/profil-picture.svg'"
             class="h-15 w-15 rounded-full"
             [alt]="userName() ? 'profile picture to ' + userName() : 'profile picture by default'"
             (error)="handlePictureError($event)"
             referrerpolicy="no-referrer">
        @if(haveNotification){
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-primaryColor border-none rounded-full"
                role="status"
                aria-label="You have notifications"></span>
        }
      </button>
    </nav>
  } @else {
    <a class="absolute top-10 right-15 hidden md:block flex items-center gap-2 rounded-md text-md font-medium whitespace-nowrap focus-visible:outline focus-visible:outline-2 text-gray-300 hover:bg-gray-900 font-medium hover:text-white focus-visible:outline-white cursor-pointer"
       href="/login">
      Connection
    </a>
  }

  @if(isHomePage()){
    <h1 class="text-white text-3xl text-center mt-auto pb-12 md:pb-20 hidden md:block">
      @if(isLogin()){
        Find the conference where you were selected
      } @else {
        Unified Space for Speaker informations
      }
    </h1>
  }
</header>
