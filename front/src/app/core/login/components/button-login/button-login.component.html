<button [class]="getButtonClasses()"
        [disabled]="disabled"
        type="button">

  @if(hasIcon()) {
    <img
      [src]="iconSrc"
      [alt]="iconAlt"
      class="h-5 w-5 flex-shrink-0"
      loading="lazy"
      aria-hidden="true"
      (error)="onImageError($event)">
  }

  <span class="text-sm leading-6">
    <ng-content/>
  </span>
</button>
