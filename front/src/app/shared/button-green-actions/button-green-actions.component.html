<button
  (click)="handleButtonClick()"
  [type]="type"
  [disabled]="disabled"
  [attr.aria-label]="ariaLabel"
  [attr.aria-disabled]="disabled"
  class="flex items-center gap-2 text-white text-sm py-1.5 px-3 rounded-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2"
  [class]="disabled
    ? 'bg-gray-400 cursor-not-allowed opacity-60'
    : 'bg-action hover:bg-action-hover cursor-pointer focus:ring-action'">

  @if(materialIcon) {
    <div class="relative inline-flex items-center justify-center">
      <span class="material-symbols-outlined text-sm"
            [class.opacity-60]="disabled">
        {{ materialIcon }}
      </span>
    </div>
  }

  <span [class.opacity-60]="disabled">
    <ng-content></ng-content>
  </span>
</button>
