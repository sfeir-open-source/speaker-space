<button
  [type]="type()"
  [class]="buttonClasses()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  (click)="handleButtonClick()">

  @if (materialIcon()) {
    <div class="relative inline-flex items-center justify-center">
      <span class="material-symbols-outlined" aria-hidden="true">
        {{ materialIcon() }}
      </span>
    </div>
  }

  <ng-content/>
</button>
