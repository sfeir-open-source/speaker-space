<app-navbar-team-page
  [teamUrl]="teamUrl()"
  [teamId]="teamId()"
  [teamName]="teamName()"
/>

<main class="flex flex-col mt-5 w-full items-center relative">
  <section class="w-full sm:w-4/5 max-w-5xl mb-6">
    <div class="w-full p-2 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
      <article>
        <h1 class="text-2xl font-medium">Team events</h1>
        <p class="mt-2 text-sm text-gray-600">
          Manage your team events call for papers
        </p>
      </article>

      <article class="flex flex-wrap items-center gap-4 mt-4 md:mt-0">
        <nav class="flex gap-1 rounded-md bg-grey shadow-sm py-1 px-1"
             aria-label="Event filters">
          <app-button
            [customClass]="'flex items-center rounded-md py-0.5 px-6 sm:px-12 text-sm cursor-pointer transition-all'"
            [class.bg-white]="activeTab() === 'Archived'"
            [class.text-gray-800]="true"
            [class.shadow-sm]="activeTab() === 'Archived'"
            (click)="setActiveTab('Archived')"
            [attr.aria-selected]="activeTab() === 'Archived'"
            type="button">
            Archived
          </app-button>

          <app-button
            [customClass]="'flex items-center rounded-md py-0.5 px-6 sm:px-12 text-sm cursor-pointer transition-all'"
            [class.bg-white]="activeTab() === 'Active'"
            [class.text-gray-800]="true"
            [class.shadow-sm]="activeTab() === 'Active'"
            (click)="setActiveTab('Active')"
            [attr.aria-selected]="activeTab() === 'Active'"
            type="button">
            Active
          </app-button>
        </nav>

        <app-button
          type="submit"
          [buttonHandler]="addEvent.bind(this)"
          materialIcon="add"
          [customClass]="'text-gray-600 hover:text-gray-600 rounded-md text-sm inline-flex items-center gap-2 bg-white hover:bg-gray-100 border border-gray-300 cursor-pointer shadow-sm'">
          New Event
        </app-button>
      </article>
    </div>
  </section>

  <section class="w-full px-4 md:px-0 sm:w-4/5 max-w-5xl">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      @for(field of formFields(); track field.idEvent) {
        <app-event-team-card [field]="field"/>
      }
    </div>
  </section>
</main>
