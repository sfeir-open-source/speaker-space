<fieldset class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
  <div>
    <label
      for="start-date"
      class="mt-5 block text-start text-md required">
      Start Date
    </label>

    <input
      id="start-date"
      type="date"
      formControlName="startDate"
      [min]="eventStartDateForInput()"
      [max]="eventEndDateForInput()"
      [attr.aria-required]="true"
      [attr.aria-invalid]="hasStartDateError()"
      class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-gray-600 sm:text-sm/6"
      [class.border-red-300]="hasStartDateError()"
      [class.outline-red-500]="hasStartDateError()" />

    @if (eventDateRange()) {
      <p class="mt-1 text-xs text-gray-500">
        Event dates: {{ eventDateRange() }}
      </p>
    }

    @if (hasStartDateError()) {
      <p class="text-sm text-red-600 flex items-center" role="alert">
        <app-icon-alert
          [name]="IconName.ERROR"
          class="mr-1" />
        Start date is required
      </p>
    }
  </div>

  <app-field
    name="startTime"
    label="Start Time"
    type="time"
    [control]="form().get('startTime')!"
    [required]="true"
    [isSubmitted]="isSubmitted()"
    errorMessage="Start time is required">
  </app-field>
</fieldset>
