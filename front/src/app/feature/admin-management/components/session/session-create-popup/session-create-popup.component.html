<app-modal
  title="Create New Session"
  submitText="Create Session"
  submittingText="Creating..."
  [isSubmitting]="isSubmitting"
  (closed)="onClose()"
  (submitted)="onSubmit()">

  <form [formGroup]="sessionForm" (ngSubmit)="onSubmit()" class="p-6 space-y-6">
    <app-session-form-fields
      [form]="sessionForm"
      [availableFormats]="availableFormats"
      [availableCategories]="availableCategories"
      [availableTracks]="availableTracks"
      [eventStartDate]="eventStartDate"
      [eventEndDate]="eventEndDate"
      [selectedSpeakers]="selectedSpeakers"
      [availableSpeakers]="availableSpeakers"
      [isLoadingSpeakers]="isLoadingSpeakers"
      [selectedDuration]="selectedDuration"
      [selectedFormats]="selectedFormats"
      [selectedCategories]="selectedCategories"
      [selectedLanguages]="selectedLanguages"
      (durationChange)="onDurationChange($event)"
      (speakersChange)="onSpeakersChange($event)"
      (formatsChange)="onFormatsChange($event)"
      (categoriesChange)="onCategoriesChange($event)"
      (languagesChange)="onLanguagesChange($event)">
    </app-session-form-fields>

    @if (errorMessage) {
      <div class="p-3 bg-red-50 border border-red-200 rounded-md" role="alert">
        <p class="text-sm text-red-600">{{ errorMessage }}</p>
      </div>
    }
  </form>
</app-modal>
