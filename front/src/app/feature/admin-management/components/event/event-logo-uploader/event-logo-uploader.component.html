<section class="mt-6">
  <input
    #fileInput
    type="file"
    accept="image/jpeg,image/png,image/webp,image/avif"
    class="hidden"
    (change)="onFileSelected($event)"
    [disabled]="!canUpload()"
    aria-label="Select image file">

  <div
    class="relative w-32 h-32 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:border-gray-400 transition-colors duration-200 flex items-center justify-center overflow-hidden"
    [class.border-blue-500]="isDragOver()"
    [class.bg-blue-50]="isDragOver()"
    [class.cursor-not-allowed]="!canUpload()"
    (click)="triggerFileInput()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    role="button"
    tabindex="0"
    [attr.aria-label]="hasImage() ? 'Change event logo' : 'Upload event logo'"
    (keydown.enter)="triggerFileInput()"
    (keydown.space)="triggerFileInput()">

    @if (showUploadArea()) {
      <div class="text-center">
        <svg class="mx-auto h-8 w-8 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <p class="mt-1 text-xs text-gray-500">Click to upload</p>
      </div>
    }

    @if (isProcessing()) {
      <div class="flex flex-col items-center">
        <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500" aria-hidden="true"></div>
        <p class="mt-2 text-xs text-gray-500">Processing...</p>
      </div>
    }

    @if (hasImage()) {
      <img
        [src]="selectedImageUrl()"
        alt="Event logo preview"
        class="w-full h-full object-cover rounded-lg">
      <app-button
        type="button"
        [customClass]="'absolute top-1 right-1 bg-red-500 hover:bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2'"
        (click)="removeImage($event)"
        aria-label="Remove image">
        ×
      </app-button>
    }
  </div>

  @if (errorMessage()) {
    <p class="mt-2 text-sm text-red-600" role="alert">{{ errorMessage() }}</p>
  }
</section>
