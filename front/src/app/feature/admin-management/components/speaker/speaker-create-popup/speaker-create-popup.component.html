<app-modal-popup-create
  title="Create New Speaker"
  submitText="Create Speaker"
  submittingText="Creating..."
  [isSubmitting]="isSubmitting()"
  (closed)="onClose()"
  (submitted)="onSubmit()">

  <form [formGroup]="speakerForm" (ngSubmit)="onSubmit()" class="p-6 space-y-6">
    <app-speaker-form-fields
      [form]="speakerForm"
      [socialLinks]="socialLinks()"
      [isSubmitted]="isSubmitted()"
      (socialLinksChange)="onSocialLinksChange($event)">
    </app-speaker-form-fields>

    @if (errorMessage()) {
      <div class="p-4 bg-red-50 border border-red-200 rounded-md" role="alert">
        <div class="flex">
          <svg
            class="w-5 h-5 text-red-400 mr-2 flex-shrink-0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L4.268 15.5c-.77.833.192 2.5 1.732 2.5z"/>
          </svg>
          <p class="text-sm text-red-800">{{ errorMessage() }}</p>
        </div>
      </div>
    }
  </form>
</app-modal-popup-create>
