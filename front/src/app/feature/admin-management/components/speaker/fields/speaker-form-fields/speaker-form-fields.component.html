<fieldset class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <app-field
    name="name"
    label="Full name"
    type="text"
    [control]="form().get('name')!"
    [required]="true"
    placeholder="Enter full name"
    [isSubmitted]="isSubmitted()"
    errorMessage="Name is required (2-100 characters)">
  </app-field>

  <app-field
    name="email"
    label="Email"
    type="email"
    [control]="form().get('email')!"
    [required]="true"
    [isSubmitted]="isSubmitted()"
    placeholder="Enter email address"
    errorMessage="Valid email is required">
  </app-field>
</fieldset>

<fieldset class="space-y-4">
  <app-field
    name="bio"
    label="Biography"
    type="textarea"
    [control]="form().get('bio')!"
    [isSubmitted]="isSubmitted()"
    [rows]="4"
    placeholder="Enter biography"
    errorMessage="Biography must not exceed 2000 characters">
    <div paragraphSuffix class="text-xs text-gray-500 mt-1">
      {{ form().get('bio')?.value?.length || 0 }}/2000 characters
    </div>
  </app-field>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <app-field
      name="company"
      label="Company"
      type="text"
      [control]="form().get('company')!"
      placeholder="Enter company name"
      [isSubmitted]="isSubmitted()"
      errorMessage="Company name must not exceed 100 characters">
    </app-field>

    <app-field
      name="location"
      label="Location"
      type="text"
      [isSubmitted]="isSubmitted()"
      [control]="form().get('location')!"
      placeholder="Enter location"
      errorMessage="Location must not exceed 100 characters">
    </app-field>
  </div>

  <app-field
    name="picture"
    label="Picture URL"
    type="url"
    [isSubmitted]="isSubmitted()"
    [control]="form().get('picture')!"
    placeholder="https://example.com/photo.jpg"
    errorMessage="Please enter a valid URL">
  </app-field>

  <app-field
    name="references"
    label="References"
    type="textarea"
    [control]="form().get('references')!"
    [rows]="3"
    [isSubmitted]="isSubmitted()"
    placeholder="Previous talks, achievements, etc."
    errorMessage="References must not exceed 2000 characters">
    <div paragraphSuffix class="text-xs text-gray-500 mt-1">
      {{ form().get('references')?.value?.length || 0 }}/2000 characters
    </div>
  </app-field>
</fieldset>

<app-social-links-field
  [socialLinks]="socialLinks()"
  (socialLinksChange)="onSocialLinksChange($event)">
</app-social-links-field>
