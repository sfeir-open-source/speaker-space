<fieldset class="mt-6">
  <legend class="block text-start text-md mb-1">Social Links</legend>

  <div class="flex gap-2 mb-3">
    <input
      type="url"
      [ngModel]="newSocialLink()"
      (ngModelChange)="newSocialLink.set($event)"
      [ngModelOptions]="{standalone: true}"
      (keydown.enter)="addSocialLink()"
      placeholder="https://www.linkedin.com/in/username"
      class="flex-1 px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
      [class.border-red-300]="errorMessage()"
      [disabled]="maxLinksReached()">

    <app-button
      type="button"
      (click)="addSocialLink()"
      [disabled]="isAddDisabled()">
      Add
    </app-button>
  </div>

  @if (socialLinks().length > 0) {
    <ul class="space-y-2" role="list">
      @for (link of socialLinks(); track link; let i = $index) {
        <li class="flex items-center justify-between p-2 bg-gray-50 rounded-md">
          <a
            [href]="link"
            target="_blank"
            rel="noopener noreferrer"
            class="text-blue-600 hover:text-blue-800 text-sm truncate flex-1 mr-2">
            {{ link }}
          </a>
          <app-button
            type="button"
            (click)="removeSocialLink(i)"
            class="text-red-500 hover:text-red-700 p-1 flex-shrink-0"
            [attr.aria-label]="'Remove social link ' + link">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </app-button>
        </li>
      }
    </ul>
  }

  @if (maxLinksReached()) {
    <p class="text-sm text-amber-600 mt-2" role="alert">
      Maximum number of social links reached (5)
    </p>
  }

  @if (errorMessage()) {
    <p class="text-sm text-red-600 mt-2" role="alert">{{ errorMessage() }}</p>
  }
</fieldset>
