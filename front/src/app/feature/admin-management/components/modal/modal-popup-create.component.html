<div
  class="fixed inset-0 bg-gray-300/90 z-50 flex items-center justify-center"
  (click)="onOverlayClick($event)"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId()">

  <section
    class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col"
    (click)="$event.stopPropagation()">

    <header class="flex items-center justify-between p-4 border-b bg-gray-100 border-gray-200 rounded-t-lg">
      <h2 [id]="titleId()" class="text-xl font-medium text-gray-900">
        {{ title() }}
      </h2>

      <button
        type="button"
        (click)="onClose()"
        [disabled]="isBlocked()"
        class="text-gray-400 hover:text-gray-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        [attr.aria-label]="'Close ' + title() + ' dialog'">
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </header>

    <main class="flex-1 overflow-y-auto">
      <ng-content></ng-content>
    </main>

    <footer class="flex justify-end gap-3 p-6 border-t border-gray-200 bg-gray-50">
      <app-button
        type="button"
        class="flex-shrink-0 rounded-md text-base items-center gap-2 bg-white hover:bg-gray-100 border border-gray-300 cursor-pointer shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
        (click)="onClose()"
        aria-label="Cancel and close dialog">
        Cancel
      </app-button>

      <app-button
        type="submit"
        form="modal-form"
        [customClass]="'flex items-center gap-2 bg-action hover:bg-action-hover disabled:bg-gray-400 disabled:cursor-not-allowed cursor-pointer text-white text-sm rounded-md transition-colors'"
        (click)="onSubmit()"
        [attr.aria-label]="submitButtonText()">

        @if (isSubmitting()) {
          <span class="flex items-center">
            <svg
              class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
              fill="none"
              viewBox="0 0 24 24"
              aria-hidden="true">
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4">
              </circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
            <span class="sr-only">Loading: </span>
            {{ submittingText() }}
          </span>
        } @else {
          {{ submitText() }}
        }
      </app-button>
    </footer>
  </section>
</div>
