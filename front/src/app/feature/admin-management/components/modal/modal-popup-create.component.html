<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50"
  (click)="onOverlayClick($event)"
  role="dialog"
  [attr.aria-labelledby]="titleId()"
  aria-modal="true">

  <div
    class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto m-4"
    (click)="$event.stopPropagation()">

    <!-- En-tête -->
    <header class="flex justify-between items-center p-6 border-b border-gray-200">
      <h2 [id]="titleId()" class="text-2xl font-bold text-gray-900">
        {{ title() }}
      </h2>

      <app-button
        type="button"
        [buttonHandler]="onClose.bind(this)"
        [disabled]="isBlocked()"
        [ariaLabel]="'Close ' + title()"
        customClass="text-gray-400 hover:text-gray-600 disabled:opacity-50 disabled:cursor-not-allowed">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </app-button>
    </header>

    <div class="p-6">
      <ng-content></ng-content>
    </div>

    <footer class="flex justify-end gap-3 p-6 border-t border-gray-200 bg-gray-50">
      <app-button
        type="button"
        [buttonHandler]="onClose.bind(this)"
        [disabled]="isBlocked()"
        customClass="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
        Cancel
      </app-button>

      <app-button
        type="submit"
        [form]="formId()"
        [disabled]="isSubmitDisabled()"
        customClass="px-4 py-2 text-sm font-medium text-white bg-action rounded-md hover:bg-action-dark disabled:opacity-50 disabled:cursor-not-allowed">
        {{ submitButtonText() }}
      </app-button>
    </footer>
  </div>
</div>
