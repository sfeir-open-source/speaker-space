<nav class="flex items-center flex-column flex-wrap md:flex-row justify-between p-4"
     aria-label="Sessions pagination navigation">
                      <span class="text-sm font-normal text-gray-600 mb-4 md:mb-0 block w-full md:inline md:w-auto">
                        Showing {{ paginationInfo().start }}-{{ paginationInfo().end }} of {{ paginationInfo().total }} results
                      </span>
  <ul class="inline-flex -space-x-px rtl:space-x-reverse text-sm h-8" role="list">
    <li>
      <app-button
        type="button"
        (click)="goToPreviousPage()"
        [disabled]="!canGoToPreviousPage()"
        [customClass]="!canGoToPreviousPage() ?
                              'flex items-center justify-center px-3 h-8 ms-0 leading-tight text-gray-300 bg-gray-100 border border-gray-300 rounded-none rounded-s-lg cursor-not-allowed' :
                              'flex items-center justify-center px-3 h-8 ms-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-none rounded-s-lg hover:bg-gray-100 hover:text-gray-700 cursor-pointer'"
        [attr.aria-label]="canGoToPreviousPage() ? 'Go to previous page' : 'Previous page (disabled)'"
        [attr.aria-disabled]="!canGoToPreviousPage()">
        Previous
      </app-button>
    </li>

    @for (pageNum of pageNumbers(); track pageNum) {
      <li>
        <app-button
          type="button"
          (click)="goToPage(pageNum)"
          [customClass]="pageNum === currentPage() ?
                                'flex items-center justify-center px-3 h-8 text-blue-600 border rounded-none border-gray-300 bg-blue-50 hover:bg-blue-100 hover:text-blue-700' :
                                'flex items-center justify-center px-3 h-8 leading-tight text-gray-500 rounded-none bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 cursor-pointer'"
          [attr.aria-label]="pageNum === currentPage() ? 'Current page ' + pageNum : 'Go to page ' + pageNum"
          [attr.aria-current]="pageNum === currentPage() ? 'page' : null">
          {{ pageNum }}
        </app-button>
      </li>
    }

    <li>
      <app-button
        type="button"
        (click)="goToNextPage()"
        [disabled]="!canGoToNextPage()"
        [customClass]="!canGoToNextPage() ?
                              'flex items-center justify-center px-3 h-8 leading-tight text-gray-300 bg-gray-100 border border-gray-300 rounded-none rounded-e-lg cursor-not-allowed' :
                              'flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 rounded-none rounded-e-lg hover:bg-gray-100 hover:text-gray-700 cursor-pointer'"
        [attr.aria-label]="canGoToNextPage() ? 'Go to next page' : 'Next page (disabled)'"
        [attr.aria-disabled]="!canGoToNextPage()">
        Next
      </app-button>
    </li>
  </ul>
</nav>
