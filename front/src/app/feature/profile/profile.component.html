<app-navbar-profile></app-navbar-profile>
<main class="flex min-h-screen">
  <app-profile-sidebar [activeSection]="activeSection()"></app-profile-sidebar>
  <section class="flex-1 p-4">
    <article class="flex justify-between items-center bg-white shadow-md p-4 rounded-md mb-4">
      <div class="flex items-center">
        <button
          (click)="syncAllSpeakerData()"
          [disabled]="syncingAll()"
          class="bg-action hover:bg-action-hover text-white mr-3 px-2 py-2 rounded-md flex items-center gap-2 cursor-pointer disabled:opacity-50">
          @if (syncingAll()) {
            <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          } @else {
            <span class="material-icons">cached</span>
          }
        </button>
        <div>
          <h1 class="text-xl">Refresh data with datas in Conference Hall</h1>
          @if (userState.hasSpeakerRole()) {
            <p class="text-sm text-gray-600">
              Speaker in {{ userState.eventIds().length }} event(s)
            </p>
          }
        </div>
      </div>
    </article>

    <app-save-indicator
      [status]="saveStatus()"
      position="bottom-right">
    </app-save-indicator>

    <form [formGroup]="profileForm">
      <app-personal-info id="personal-info"></app-personal-info>
      <app-biography id="biography"></app-biography>
      <app-social-networks id="social-networks"></app-social-networks>
    </form>
  </section>
</main>
