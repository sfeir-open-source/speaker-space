<app-navbar-profile/>
<main class="flex min-h-screen">
  <app-profile-sidebar [activeSection]="activeSection()"/>
  <section class="flex-1 p-4">
    <article class="flex justify-start items-center bg-white shadow-md p-4 rounded-md">
      <app-button
        type="button"
        [customClass]="'bg-action hover:bg-action-hover text-white mr-3 px-2 py-2 rounded-md flex items-center gap-2 cursor-pointer'">
        <span class="material-icons">cached</span>
      </app-button>
      <h1 class="text-xl">Refresh data with datas in Conference Hall</h1>
    </article>

    <app-save-indicator
      [status]="saveStatus()"
      position="bottom-right">
    </app-save-indicator>

    <form [formGroup]="profileForm">
      <app-personal-info id="personal-info"/>
      <app-biography id="biography"/>
      <app-social-networks id="social-networks"/>
    </form>
  </section>
</main>
